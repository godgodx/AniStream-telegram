services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BIND_HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://anistream:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/anistream
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - database

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anistream
      POSTGRES_USER: anistream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anistream -d anistream"]
      interval: 10s
      timeout: 5s
      retries: 10
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ANISTREAM_DOMAIN: ${ANISTREAM_DOMAIN:?Set ANISTREAM_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  database:
    internal: true
