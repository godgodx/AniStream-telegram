<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>AniStream</title>
    <link rel="stylesheet" href="/app/assets/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script src="/app/assets/hls.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">ANISTREAM</p>
          <h1 id="title">Preparing your stream…</h1>
          <p id="subtitle" class="subtitle">Secure Telegram playback</p>
        </div>
        <button id="fullscreen" class="icon-button" type="button" aria-label="Enter fullscreen">⛶</button>
      </header>

      <section class="player-card" aria-label="Video player">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="loading" class="loading" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span id="status">Authenticating with Telegram…</span>
        </div>
      </section>

      <section class="details">
        <div>
          <span class="label">Episode</span>
          <strong id="episode">—</strong>
        </div>
        <div>
          <span class="label">Source</span>
          <strong id="source">—</strong>
        </div>
        <div>
          <span class="label">Progress</span>
          <strong id="progress">0:00</strong>
        </div>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script type="module" src="/app/assets/main.js"></script>
  </body>
</html>
