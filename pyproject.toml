[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anistream-telegram"
version = "0.1.0"
description = "Private Telegram bot and Mini App for secure AniStream watch sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.28,<4",
    "aiohttp>=3.12,<4",
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "beautifulsoup4>=4.12,<5",
    "cryptography>=45,<47",
    "pycryptodome>=3.20,<4",
    "requests>=2.32,<3",
    "SQLAlchemy>=2.0.40,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "responses>=0.25,<1",
]

[project.scripts]
anistream-telegram = "anistream_telegram.app:main"
anistream-admin = "anistream_telegram.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anistream_telegram = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
