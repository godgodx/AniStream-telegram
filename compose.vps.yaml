services:
  app:
    container_name: anistream-app
    ports:
      - "127.0.0.1:8081:8080"
    pids_limit: 256
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  database:
    container_name: anistream-postgres
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # The VPS already has one hardened Caddy instance on public ports 80/443.
    # This bundled proxy stays disabled unless explicitly requested.
    profiles:
      - standalone-caddy
